# 테스트용 안드로이드 APK 빌드.
# Actions 탭 > "Build Android APK" > Run workflow 로 실행하면
# Releases 의 "test-latest" 에 app-release.apk 가 올라간다 (폰에서 바로 다운로드 가능).
#
# 필요한 GitHub Secret:
#   GOOGLE_SERVICES_JSON : Firebase 에서 받은 google-services.json 파일 내용 전체
#   NAVER_MAP_CLIENT_ID  : 네이버 클라우드 플랫폼 Maps 의 Client ID (없으면 지도 대신 안내 문구가 나옴)
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret 이 없습니다. README 의 '배포하기'를 참고하세요."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json

      # 서명 키는 저장소에 두지 않고 GitHub Secret 에만 둔다 (공개 저장소).
      # 매번 같은 키로 서명해야 폰에서 "업데이트"로 설치되고 구글 로그인(SHA-1)도 유지된다.
      - name: Write signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secret 이 없습니다. README 의 '서명 키'를 참고하세요."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=familylocator"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
          } > app/android/key.properties

      - name: Analyze
        run: flutter analyze
        working-directory: app

      - name: Test
        run: flutter test
        working-directory: app

      - name: Build APK
        env:
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=NAVER_MAP_CLIENT_ID="$NAVER_MAP_CLIENT_ID"
        working-directory: app

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk family-locator.apk
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest family-locator.apk \
            --prerelease \
            --title "테스트 빌드 #${{ github.run_number }}" \
            --notes "커밋 ${{ github.sha }} 로 만든 테스트용 APK 입니다. 폰에서 family-locator.apk 를 눌러 설치하세요." \
            --target "${{ github.sha }}"

