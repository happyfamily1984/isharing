# 서버(Cloud Functions + Firestore 보안 규칙) 배포.
# main 브랜치에 서버 코드가 바뀌어 올라오면 자동 실행되고, Actions 탭에서 수동 실행도 가능하다.
#
# 필요한 GitHub Secrets (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT : 배포용 서비스 계정 키(JSON) 전체 내용
#   FIREBASE_PROJECT_ID      : Firebase 프로젝트 ID (예: family-locator-1a2b3)
name: Deploy Firebase backend

on:
  # GitHub Actions 무료 시간을 아끼려고 자동 실행은 끈다 (머지해도 돌지 않음).
  # 보통은 scripts/ 의 스크립트로 Claude 작업 환경에서 빌드·배포하고,
  # 필요할 때만 Actions 탭 > Run workflow 로 직접 실행한다.
  workflow_dispatch:

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Type check and test
        run: npm test
        working-directory: functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy
        run: >
          npx --yes firebase-tools@14 deploy
          --only firestore,functions
          --project "${{ secrets.FIREBASE_PROJECT_ID }}"
          --non-interactive --force

      # firebase deploy 는 호출형(onCall) 함수의 공개 호출 권한을 "처음 만들 때만" 설정한다.
      # 첫 배포가 중간에 실패하면 이 권한이 빠진 채 남아 앱에서 UNAUTHENTICATED 오류가 나므로
      # 매 배포마다 확실히 설정한다 (이미 있으면 변화 없음). 호출자 인증·권한 검사는 각 함수 코드가 한다.
      - uses: google-github-actions/setup-gcloud@v2

      - name: Allow app to call callable functions
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          for fn in createGroup regenerateInvite requestJoin respondJoin leaveGroup removeMember deleteMyData ringDevice requestLive; do
            service=$(echo "$fn" | tr '[:upper:]' '[:lower:]')
            gcloud run services add-iam-policy-binding "$service" \
              --project "$PROJECT_ID" --region asia-northeast3 \
              --member=allUsers --role=roles/run.invoker --quiet >/dev/null
            echo "✔ $fn"
          done
